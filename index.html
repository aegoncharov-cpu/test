<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Définitions: test de vocabulaire A2–B2</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1d1d1f;--mu:#6b6b72;--ac:#2f5bea;--ok:#1f9d55;--okb:#dff5e6;--no:#d64545;--nob:#fde4e4;--bd:#dcd9d0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16171b;--card:#202228;--tx:#f0f0f2;--mu:#9a9aa5;--ac:#7c9bff;--ok:#4cd08a;--okb:#16372a;--no:#ff7a7a;--nob:#3d1d1d;--bd:#34363f}}
:root[data-theme="dark"]{--bg:#16171b;--card:#202228;--tx:#f0f0f2;--mu:#9a9aa5;--ac:#7c9bff;--ok:#4cd08a;--okb:#16372a;--no:#ff7a7a;--nob:#3d1d1d;--bd:#34363f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 14px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.lab{font-size:13px;color:var(--mu);margin-top:10px}
.chip,.opt,.btn{font:inherit;color:var(--tx);background:var(--card);border:1.5px solid var(--bd);border-radius:12px;padding:10px 14px;cursor:pointer}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.btn{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600;width:100%;padding:14px;margin-top:12px}
.btn.g{background:var(--card);color:var(--tx);border-color:var(--bd)}
.nav{display:flex;gap:10px}
.card{background:var(--card);border:1.5px solid var(--bd);border-radius:18px;padding:22px 16px;text-align:center;margin:10px 0 14px}
.q{font-size:20px;font-weight:600;word-break:break-word}
.tag{font-size:12px;color:var(--mu);margin-bottom:8px}
.opts{display:grid;gap:10px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;width:100%}
.opt.sel{background:color-mix(in srgb,var(--ac) 18%,var(--card));border-color:var(--ac)}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);width:0}
.top{display:flex;justify-content:space-between;font-size:14px;color:var(--mu);margin-bottom:6px}
.sp{background:none;border:none;font-size:20px;cursor:pointer;padding:0 4px;flex:none}
.big{font-size:44px;font-weight:800;text-align:center;margin:16px 0 4px}
.rv{background:var(--card);border:1.5px solid var(--bd);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px}
.rv.ok{border-color:var(--ok);background:var(--okb)}.rv.no{border-color:var(--no);background:var(--nob)}
.hide{display:none}
</style></head><body><main>
<div id="menu">
<h1>🇫🇷 Définitions: тест на понимание</h1>
<div class="lab">Уровень</div><div class="row" id="lv"></div>
<div class="lab">Тип вопроса</div><div class="row" id="dr"></div>
<div class="lab">Количество вопросов</div><div class="row" id="nn"></div>
<button class="btn" id="go">Commencer</button>
<p class="lab" id="cnt"></p>
<p class="lab">Результат и правильные ответы показываются в конце теста. Кнопка 🔊 произносит слово или определение.</p>
</div>
<div id="game" class="hide">
<div class="top"><span id="pg"></span><span>🔊 écoute</span></div>
<div class="bar"><i id="pb"></i></div>
<div class="card"><div class="tag" id="tg"></div><div class="q"><span id="qt"></span><button class="sp" id="sp" aria-label="Écouter">🔊</button></div></div>
<div class="opts" id="op"></div>
<div class="nav"><button class="btn g" id="pv">Précédent</button><button class="btn" id="nx">Suivant</button></div>
</div>
<div id="end" class="hide"></div>
</main>
<script>
const D={A2:`la boulangerie|Magasin où l'on achète du pain
la pharmacie|Magasin où l'on achète des médicaments
le médecin|Personne qui soigne les malades
la gare|Lieu où l'on prend le train
l'aéroport|Lieu où l'on prend l'avion
la valise|Grand sac rigide dans lequel on met ses vêtements pour voyager
le billet|Papier qui permet de voyager en train ou d'entrer au cinéma
le voisin|Personne qui habite près de chez vous
le patron|Personne qui dirige une entreprise ou une équipe
le collègue|Personne qui travaille avec vous
le petit-déjeuner|Premier repas de la journée
le dîner|Repas du soir
la fenêtre|Ouverture dans un mur qui laisse entrer la lumière
la cuisine|Pièce où l'on prépare les repas
la pluie|Eau qui tombe du ciel
la neige|Flocons blancs et froids qui tombent en hiver
fatigué|Qui a besoin de se reposer ou de dormir
cher|Qui coûte beaucoup d'argent
oublier|Ne plus se souvenir de quelque chose
attendre|Rester quelque part jusqu'à l'arrivée de quelqu'un
choisir|Prendre une chose parmi plusieurs
ouvrir|Faire en sorte qu'une porte ne soit plus fermée
hier|Le jour avant aujourd'hui
demain|Le jour après aujourd'hui
toujours|À tout moment, sans exception
jamais|À aucun moment
le marché|Lieu en plein air où l'on vend des fruits et des légumes
le fromage|Aliment fabriqué avec du lait, comme le camembert
la famille|Les parents, les enfants, les frères et les sœurs
le rendez-vous|Rencontre prévue à une heure précise`,
B1:`le salaire|Argent qu'on reçoit chaque mois pour son travail
le chômage|Situation d'une personne qui n'a pas d'emploi
le loyer|Somme qu'on paie chaque mois pour habiter un logement
le propriétaire|Personne à qui appartient un logement
le locataire|Personne qui paie un loyer pour habiter un logement
déménager|Changer de logement
l'embouteillage|Longue file de voitures bloquées sur la route
la grève|Arrêt du travail décidé par des employés pour protester
le retard|Fait d'arriver après l'heure prévue
l'entretien d'embauche|Rencontre avec un employeur pour obtenir un emploi
éviter|Faire en sorte de ne pas rencontrer ou subir quelque chose
gaspiller|Utiliser trop de choses ou les perdre inutilement
économiser|Mettre de l'argent de côté au lieu de le dépenser
emprunter|Recevoir de l'argent ou un objet qu'on doit rendre plus tard
rembourser|Rendre l'argent qu'on a reçu
se plaindre|Dire qu'on n'est pas content
se dépêcher|Aller vite parce qu'on est pressé
s'habituer|Trouver normal quelque chose de nouveau avec le temps
hésiter|Ne pas savoir quoi choisir ou quoi faire
profiter|Tirer un bon avantage d'une situation
remarquer|Voir quelque chose qui n'était pas évident
reprocher|Dire à quelqu'un qu'il a mal agi
le souvenir|Image d'un moment passé qu'on garde en tête
le défi|Chose difficile qu'on essaie de réussir
l'échec|Résultat quand on n'a pas réussi
la confiance|Sentiment de croire en quelqu'un sans craindre d'être trompé
pourtant|Mot qui exprime une opposition, malgré ce qui vient d'être dit
d'ailleurs|Mot qu'on utilise pour ajouter une information supplémentaire
le conseil|Avis donné pour aider quelqu'un à décider
l'habitude|Chose qu'on fait régulièrement, sans y penser`,
B2:`l'enjeu|Ce qu'on peut gagner ou perdre dans une situation
la tendance|Direction générale dans laquelle évoluent les choses
l'atout|Avantage qui donne plus de chances de réussir
l'inconvénient|Aspect négatif d'une situation
la contrainte|Obligation qui limite la liberté d'agir
l'échéance|Date limite à laquelle quelque chose doit être fait
le délai|Temps accordé pour accomplir une action
le bilan|Résumé des résultats à la fin d'une période
la lacune|Manque dans les connaissances ou dans un ensemble
le malentendu|Erreur de compréhension entre deux personnes
le préjugé|Opinion qu'on se fait d'avance, sans connaître
le compromis|Accord où chacun fait des concessions
l'ampleur|Taille ou importance d'un phénomène
la méfiance|Attitude de celui qui ne fait pas confiance
la bienveillance|Disposition à vouloir le bien d'autrui
la rancune|Souvenir amer d'une offense qu'on ne pardonne pas
aggraver|Rendre une situation pire
atténuer|Rendre moins fort ou moins grave
souligner|Insister sur un point pour le mettre en valeur
renoncer|Abandonner l'idée de faire ou d'obtenir quelque chose
négliger|Ne pas s'occuper de quelque chose comme il faudrait
trancher|Prendre une décision après avoir hésité
dénoncer|Signaler publiquement quelque chose d'injuste ou d'illégal
entraîner|Avoir pour conséquence
s'avérer|Se révéler être, avec le temps
néanmoins|Malgré cela, cependant
désormais|À partir de maintenant
davantage|En plus grande quantité
certes|Mot qui admet un point avant d'introduire une objection
le patrimoine|Ensemble des biens qu'une personne possède`};
const W=Object.entries(D).flatMap(([lv,t])=>t.trim().split('\n').map(s=>{const[m,d]=s.split('|');return{m,d,lv}}));
const $=id=>document.getElementById(id);
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const say=t=>{try{const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}};
let S={lv:'Все',dr:'def',n:20},deck,i;
function chips(id,items,key){const el=$(id);el.innerHTML='';items.forEach(([v,l])=>{const b=document.createElement('button');b.className='chip'+(S[key]===v?' on':'');b.textContent=l;b.onclick=()=>{S[key]=v;menu()};el.appendChild(b)})}
const pool=()=>S.lv==='Все'?W:W.filter(w=>w.lv===S.lv);
function menu(){chips('lv',[['Все','A2–B2'],['A2','A2'],['B1','B1'],['B2','B2']],'lv');chips('dr',[['def','Определение → слово'],['mot','Слово → определение'],['mix','Микс']],'dr');chips('nn',[[10,'10'],[20,'20'],[9999,'Все']],'n');$('cnt').textContent='В выбранном наборе: '+pool().length+' слов'}
function start(){deck=sh(pool()).slice(0,S.n).map(w=>{const d=S.dr==='mix'?(Math.random()<.5?'def':'mot'):S.dr;
const o=sh([w,...sh(W.filter(x=>x.lv===w.lv&&x!==w)).slice(0,3)]);return{w,d,o,a:null}});
i=0;$('menu').classList.add('hide');$('end').classList.add('hide');$('game').classList.remove('hide');show()}
function show(){const q=deck[i],def=q.d==='def';
$('tg').textContent=def?'Quel mot correspond à cette définition ?':'Quelle est la définition de ce mot ?';
$('qt').textContent=def?q.w.d:q.w.m;$('sp').onclick=()=>say(def?q.w.d:q.w.m);
const box=$('op');box.innerHTML='';
q.o.forEach((o,k)=>{const t=def?o.m:o.d;const b=document.createElement('div');b.className='opt'+(q.a===k?' sel':'');b.setAttribute('role','button');
const s=document.createElement('span');s.textContent=t;const p=document.createElement('button');p.className='sp';p.textContent='🔊';p.setAttribute('aria-label','Écouter');
p.onclick=e=>{e.stopPropagation();say(t)};b.append(s,p);
b.onclick=()=>{q.a=k;[...box.children].forEach((c,j)=>c.classList.toggle('sel',j===k))};box.appendChild(b)});
$('pg').textContent=(i+1)+' / '+deck.length;$('pb').style.width=(i/deck.length*100)+'%';
$('pv').style.visibility=i?'visible':'hidden';$('nx').textContent=i+1>=deck.length?'Terminer':'Suivant'}
function finish(){$('game').classList.add('hide');const e=$('end');e.classList.remove('hide');
const ok=deck.filter(q=>q.o[q.a]===q.w).length,p=Math.round(ok/deck.length*100);
e.innerHTML='<div class="big">'+p+'%</div><p style="text-align:center;color:var(--mu)">'+ok+' / '+deck.length+' réponses correctes</p><div id="rv"></div><button class="btn" id="rs">Recommencer</button><button class="btn g" id="mn">Menu</button>';
const rv=$('rv');deck.forEach(q=>{const good=q.o[q.a]===q.w,def=q.d==='def',f=o=>o?(def?o.m:o.d):'—';
const d=document.createElement('div');d.className='rv '+(good?'ok':'no');
d.innerHTML='<div>'+(good?'✓ ':'✗ ')+'<b></b></div><div class="y"></div><div class="c"></div>';
d.querySelector('b').textContent=def?q.w.d:q.w.m;
if(!good)d.querySelector('.y').textContent='Ta réponse : '+f(q.o[q.a]);
d.querySelector('.c').textContent='Bonne réponse : '+f(q.w);
const b=document.createElement('button');b.className='sp';b.textContent='🔊';b.onclick=()=>say(q.w.m);d.querySelector('.c').append(b);
rv.appendChild(d)});
$('rs').onclick=start;$('mn').onclick=()=>{e.classList.add('hide');$('menu').classList.remove('hide');menu()};scrollTo(0,0)}
$('go').onclick=start;
$('nx').onclick=()=>{if(i+1>=deck.length)finish();else{i++;show()}};
$('pv').onclick=()=>{if(i){i--;show()}};
menu();
</script></body></html>
